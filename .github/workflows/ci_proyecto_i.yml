name: proyecto-i-ci

on:
  push:
    branches: [main, Santi]
    paths:
      - "proyectos/proyecto_i/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci_proyecto_i.yml"
  pull_request:
    paths:
      - "proyectos/proyecto_i/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci_proyecto_i.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python from .python-version
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Unit tests + coverage gate (>= 60%)
        working-directory: proyectos/proyecto_i
        run: |
          uv run --project ../.. --no-sync python -m pytest -q \
            --cov=ventas_app \
            --cov-report=term-missing \
            --cov-fail-under=60
