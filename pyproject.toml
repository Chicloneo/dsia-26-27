[project]
name = "dsia-26-27"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Santiago Lillo Macías", email = "santilillomacias@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "typing>=3.10.0.0",
]

[project.scripts]
dsia-26-27 = "dsia_26_27:main"

[tool.pytest.ini_options]
markers = [
    "integration: test de integracion con datos reales del curso",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
